name: wf-pr-validation
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  ci-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository on Runner
        uses: actions/checkout@v4
      - name: Lint HTML
        run: npx htmlhint "**/*.html"
      - name: Lint CSS
        run: npx stylelint "**/*.css"
      - name: Build website with parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
